name: Optional native capture fixture checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native-capture:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-capture.txt
      - run: python -m unittest discover -s tests -p test_capture.py -v
